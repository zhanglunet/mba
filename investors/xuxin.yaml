    evidence: 21财经《今日资本徐新:伟大的公司不多,一定要长期持有》(2022-05-24) m.21jingji.com/article/20220524/herald/f34557f814c06676252df6c437f88bf0.html
  - brand: 京东
    year: '2006'
    note: 1000 万美元投资(创始人只求 200 万),今日资本成名之战
    evidence: 21财经《3亿美元,徐新拿下字节老股》(2025-11-26) www.21jingji.com/article/20251126/herald/74ca7024d761a7b5c628e2328678225e.html
  - brand: 网易
    year: '2000'
    note: 互联网泡沫期间以 500 万美元入股
    evidence: 21财经《3亿美元,徐新拿下字节老股》(2025-11-26) www.21jingji.com/article/20251126/herald/74ca7024d761a7b5c628e2328678225e.html
  - brand: 字节跳动
    year: '2025'
    note: 以近 3 亿美元竞得老股(非早期轮),她称错过字节是自己的认知边界
