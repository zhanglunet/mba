# 关系解读:**标注分析**,不是她本人原话,故每条以「分析:」开头(与 founders 同一硬约束)。
relation:
  origin: 分析:审计出身(中行 + 普华永道)让她把"看财报、翻年报"当基本功;她把研究历史赢家的传记与年报列为方法论第一步,这与外语系 + 审计的复合背景一致。
  category: 分析:她把品类判断放在赛道层面 —— 先确认品类对路,再找该品类的先行者重仓,而非在同一品类里分散下注。
  leverage: 分析:她的杠杆是"给到远超对方开口的钱",让被投公司舍命狂奔占据领先位置;京东 200 万变 1000 万是这一手法的原型。
  identity: 分析:她公开复盘自己错过字节与拼多多,并把原因归到"认知之外的钱赚不到",这种把盲区讲出来的做法本身构成其公众身份的一部分。
  signal: 分析:她对"心智占领"给出可观测口径(城市 20% 人口天天看到 → 成为品牌;50% → 很牛的品牌),使品牌强度成为可验证的信号而非感觉。

sources:
  - 21财经《今日资本徐新:伟大的公司不多,一定要长期持有》(南京大学 120 周年校友直播访谈,2022-05-24) —— 一手:含其第一人称长段自述 https://m.21jingji.com/article/20220524/herald/f34557f814c06676252df6c437f88bf0.html
  - 21财经《3亿美元,徐新拿下字节老股》(2025-11-26) —— 二手报道 https://www.21jingji.com/article/20251126/herald/74ca7024d761a7b5c628e2328678225e.html
  - 新浪财经《徐新豪掷3亿补票?字节跳动4800亿估值登顶全球非上市企业第二》(2025-11-25) —— 二手报道 https://finance.sina.com.cn/roll/2025-11-25/doc-infyqqee5816775.shtml
  - 逐字引语与心智模型见 perspectives/xuxin-perspective/references/research/01-06.md(前瞻大咖自述 / 格隆汇访谈 / 南大校友访谈三源)
