# 创始人晚餐 —— 王慧文(美团联合创始人) × 徐新(今日资本)
#
# **第一场「创始人 × 投资人」配对**(docs/28 的投资人维度上线后才成为可能)。
# 参与者 slug:`meituan` = founders/meituan.yaml · `xuxin` = investors/xuxin.yaml。
#
# 为什么是这一对:徐新在南京大学校友访谈里亲口把美团与京东并列为自己最成功的两个案例;
# 美团又是 MBA 已审品牌(v4)。而「徐新 × 刘强东」做不了——**京东不在被审品牌白名单**,
# 没有创始人档案(founders/ 按品牌建索引)。
#
# 反捏造:say 是**AI 基于双方公开立场的演绎**,不是逐字原话(页面有硬编码 disclaimer)。
# 徐新的公开观点锚点在 perspectives/xuxin-perspective/references/research/ 与
# investors/xuxin.yaml;王慧文的锚点在 founders/meituan.yaml。tensions = 诚实盒,必须在位。

brands:
  - meituan
  - xuxin

title: 「密集开店」遇上「无边界」:一位零售投资人和一位联合创始人聊心智

scene: >
  假想场景:北京望京一家开到深夜的火锅店。把「相信品牌的力量、相信复合增长的力量」
  当作二十年方法论的徐新,与在美团把业务从团购一路推到外卖、酒旅、出行的王慧文,
  隔着翻滚的锅底聊起同一个问题——消费者的心智到底是被什么占住的。
  以下对谈为 AI 基于双方公开立场的演绎,非本人真实发言。

courses:
  - lens: origin
    idea: >
      两条通往「零售」的不同路径:一位从审计与年报里读出赢家模式,一位从千团大战的
      地面战里打出运营密度。共同点是都不相信「靠感觉做决策」。
    exchange:
      - who: xuxin
        say: >
          我做投资的方法论很笨——先做 winner pattern study。研究零售的时候,我们把
          亚马逊、沃尔玛、Costco、7-11、Aldi 的创始人传记和年报全部看了一遍。看得足够多,
          心里才有森林。所以生鲜电商的春天,我们比别人早看到十二到十八个月。
      - who: meituan
        say: >
          我们那时候没有传记可看,只有地推。千团大战最后拼的不是谁融得多,是谁在
          一个城市里把商户和骑手的密度做起来。你说的森林,我们是一棵树一棵树种出来的。
      - who: xuxin
        say: >
          那其实是同一件事的两面。我看年报是想知道赢家长什么样,你做密度是在
          让自己长成那个样子。区别只是我在岸上看,你在水里游。

  - lens: category
    idea: >
      「品类对路」与「无边界」的正面碰撞:投资人主张先站住一个品类再扩,
      联合创始人主张边界由用户需求而非公司意愿决定。
    exchange:
      - who: xuxin
        say: >
          我一直讲品类对路。找到对的品类里的先行者,给它足够多的钱,让它舍命狂奔
          占住位置。品类不对,再努力也是白费力气。
      - who: meituan
        say: >
          我理解你的逻辑,但我们内部的说法是「无边界」。边界不是公司画的,是用户画的。
          用户在你这儿订了外卖,他就顺手想订酒店、打车。你不做,他就去别人那儿做。
      - who: xuxin
        say: >
          这就是我们会吵架的地方。我怕的是「什么都做」最后什么都不第一。
          我的标准很硬——你在这个品类里是不是第一?第一和第二的估值差十倍。
      - who: meituan
        say: >
          所以我们也不是全做。真正投人投钱的还是高频、刚需的那几块,
          低频的用来接住高频溢出的流量。看起来无边界,内部其实一直在排优先级。

  - lens: leverage
    idea: >
      资本杠杆的两种用法:一次性给到远超对方开口的钱让它甩开对手,
      与用组织与补贴效率把每一块钱花出更高的密度。
    exchange:
      - who: xuxin
        say: >
          融资一定要快、金额要大。当年有人只开口要两百万美元,我给了一千万。
          一个公司怎么样都不会死,只有钱没了才会死。钱要多到对手望尘莫及。
      - who: meituan
        say: >
          我们经历过补贴战,知道钱能买来单量,但买不来留存。同样一块钱补贴,
          花在履约效率上和花在拉新上,三个月后差别巨大。
      - who: xuxin
        say: >
          这个我认。我给钱是为了买时间窗口,不是买单量。窗口期里你得把
          效率和心智做出来,不然钱一停就打回原形。
      - who: meituan
        say: >
          对,补贴是杠杆不是护城河。护城河是骑手调度、商户供给和那套算法。

  - lens: identity
    idea: >
      两人都把「承认自己看不懂」摆到台面上——这构成各自身份里少见的一面。
    exchange:
      - who: xuxin
        say: >
          我最出名的两次失手,一次是很早见张一鸣嫌七十亿美元贵,一次是错过拼多多。
          后来我带团队下乡,去安徽的村里住了两天,才明白自己根本不了解低线的生活。
          你赚不到你认知之外的钱。
      - who: meituan
        say: >
          我们也有看错的时候。有些业务当时觉得该做,后来发现是把公司的注意力
          稀释掉了。承认做错然后停掉,比死撑面子难。
      - who: xuxin
        say: >
          所以我现在做任何判断之前,一定先把创始人的公开演讲全部打出来看完。
          追求真理,每颗石头都翻开看——不然你只是在用直觉赌博。

  - lens: signal
    idea: >
      把「品牌强度」从感觉变成可观测口径:密集开店的 20%/50% 阈值,
      与美团侧的复购率、履约时效等运营信号,能否互相校准。
    exchange:
      - who: xuxin
        say: >
          怎么判断一个品牌成没成?我的口径很具体:让一个城市里 20% 的人天天看到你,
          你开始变成品牌;50% 的人看到你,你就是很牛的品牌。星巴克不是最好喝的咖啡,
          但它的店开得到处都是。
      - who: meituan
        say: >
          线上没有「店」,我们的等价物是心智入口的调用频次。一个用户一个月
          打开几次、下单几次、多久没来就流失——这些比曝光更接近真相。
      - who: xuxin
        say: >
          那我们的口径其实可以对上。你的高频调用就是我的「天天看到」,
          只不过发生在手机里而不是街上。共同点是:都得可观测,不能靠感觉。
      - who: meituan
        say: >
          但要提醒一句,线上的密度可以靠补贴买,线下的店开出来是真金白银。
          你的口径更难作假,这一点我羡慕。

takeaways:
  - 两套方法论殊途同归于「不靠感觉」:一边从历史赢家的年报里提炼模式,一边从地面运营里长出密度,最终都要求品牌强度可观测。
  - 「密集开店」与「无边界」不是同一层的策略:前者是占住单一品类心智的手段,后者是承接需求外溢的组织选择,二者可以叠加而非互斥。
  - 资本杠杆的共识是「买时间窗口而非买单量」——钱能加速,但护城河仍要在窗口期内用效率和心智建出来。
  - 双方都把「承认看不懂」作为方法论的一部分:徐新的下乡调研与美团侧的业务止损,本质是同一种纠错机制。

tensions:
  - 品类聚焦 vs 业务外溢是**真实分歧**,不是话术差异:徐新的估值判断建立在「第一名溢价」上,而多业务矩阵天然稀释单一品类的第一性,这一点桌上没有谈拢。
  - 「给到远超开口的钱」在补贴战中可能放大而非缩短窗口期——历史上多个赛道因资本超配把窗口拖长、把所有参与者一起拖瘦,这与徐新的杠杆逻辑存在张力。
  - 20%/50% 的心智阈值来自线下零售场景,迁移到线上平台缺乏公开可验证的对应口径;本场对谈把两者"对齐"是推演,不是已被验证的结论。
  - 王慧文已从美团一线离任,其公开表达的时点与美团当前战略未必一致;不应把本场发言当作美团现行立场。
  - 徐新与美团存在历史投资关系,双方对该案例的评价天然带有立场,读者应据此打折。

featured: false

