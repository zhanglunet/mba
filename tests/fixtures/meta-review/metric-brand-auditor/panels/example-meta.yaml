# 不进 scripts/validate_panels.py 的真实 panel 清单（该工具只扫真实 panels 目录）。

name: example-meta
display_name: Example Meta Panel (fixture)
description: >
  PRD-177/T3 findings 消费方测试专用占位 panel：只含三位样例评委
  alpha-judge / beta-judge / gamma-judge，全部内容为占位示例，
  不指向任何真实评委或品牌。

judges:
  - slug: alpha-judge
    display_name_cn: 样例评委 A（占位）
    language: zh
    weight: 1.0
  - slug: beta-judge
    display_name_cn: 样例评委 B（占位）
    language: zh
    weight: 1.0
  - slug: gamma-judge
    display_name_cn: 样例评委 C（占位）
    language: zh
    weight: 1.0
